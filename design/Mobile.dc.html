  </nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { swapped: false, cur: 'TRY' }; }
  renderVals() {
    const s = this.state.swapped;
    const rates = { TRY: 1, EUR: 1 / 40, USD: 1 / 34.5 };
    const sym = { TRY: '₺', EUR: '€', USD: '$' };
    return {
      cur: this.state.cur,
      setCur: (e) => this.setState({ cur: e.target.value }),
      romePrice: sym[this.state.cur] + Math.round(1890 * rates[this.state.cur]).toLocaleString('tr-TR'),
      fromCity: s ? 'İzmir' : 'Amsterdam',
      toCity: s ? 'Amsterdam' : 'İzmir',
      swap: () => this.setState({ swapped: !s })
    };
  }
}
</script>
